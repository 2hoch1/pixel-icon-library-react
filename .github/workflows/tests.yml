name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Format
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-name: Format
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify dynamic imports resolve from dist
        run: |
          node -e "import('./dist/dynamicIconImports.js').then(async (m) => { const mod = await m.default['heart'](); if (mod?.default == null) throw new Error('heart loader did not resolve a component'); console.log('OK dynamic import: heart ->', typeof mod.default); }).catch((e) => { console.error(e); process.exit(1); })"

      - name: Verify no upstream runtime dependency leaked into dist
        run: |
          if grep -rln "@hackernoon/pixel-icon-library" dist --include=*.js --include=*.cjs; then
            echo "ERROR: @hackernoon/pixel-icon-library referenced in shipped output"; exit 1
          fi
          echo "OK: no upstream package references in dist js/cjs"

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          du -sh dist/index.js dist/index.cjs 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
